# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080

# Don't warn about ignored build scripts
ignoredBuiltDependencies: []

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

peerDependencyRules:
  allowedVersions:
    eslint: '10'

overrides:
  '@typescript-eslint/typescript-estree>minimatch': '>=9.0.7'
  'brace-expansion': '>=5.0.8'
  'cookie': '>=0.7.0'
  'csstype': '3.2.3'
  'dompurify': '>=3.4.12'
  'fast-uri': '>=3.1.4'
  'immutable': '>=5.1.8'
  'isomorphic-dompurify': '2.26.0'
  'js-cookie': '>=3.0.6'
  'lodash': '>=4.18.1'
  'postcss': '>=8.5.18'
  'sharp': '>=0.35.0'
  'shell-quote': '>=1.8.5'
  'tmp': '>=0.2.6'
  'uuid': '>=11.1.1'
  'js-yaml@^3': '^4.2.0'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: false
  msw: false
  sharp: true
  unrs-resolver: true
